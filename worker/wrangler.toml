name = "usbnew-kiwoom-screener"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# 09:01~15:46 KST(평일)를 2분 간격으로 커버 (UTC 0시~6시 46분대)
[triggers]
crons = ["*/2 0-6 * * 1-5"]

# ---------------------------------------------------------------------------
# 아래 바인딩은 전부 "이 프로젝트 전용으로 새로 만든" 리소스를 가리켜야 합니다.
# 기존에 다른 워커/프로젝트가 쓰던 database_id / KV id / 버킷명을 그대로 복사해 넣지 마세요 -
# 그러면 DB/캐시/relay가 다시 공유되어 이번 분리 작업의 의미가 없어집니다.
# ---------------------------------------------------------------------------

# 1) D1: `wrangler d1 create usbnew-kiwoom-db` 실행 후 나온 database_id로 교체
[[d1_databases]]
binding = "DB"
database_name = "usbnew-kiwoom-db"
database_id = "REPLACE_WITH_NEW_D1_DATABASE_ID"

# 2) KV: `wrangler kv namespace create CACHE_KV` 실행 후 나온 id로 교체
[[kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_WITH_NEW_KV_NAMESPACE_ID"

# 3) R2: `wrangler r2 bucket create usbnew-kiwoom-backtest` 로 새로 생성
[[r2_buckets]]
binding = "BACKTEST_R2"
bucket_name = "usbnew-kiwoom-backtest"

# 4) Analytics Engine: 데이터셋명도 이 프로젝트 전용으로 새로 지정
[[analytics_engine_datasets]]
binding = "SIGNAL_ANALYTICS"
dataset = "usbnew_signal_analytics"

# 5) Workers AI - 계정 단위 바인딩이라 별도 생성 불필요, 그대로 사용
[ai]
binding = "AI"

# ---------------------------------------------------------------------------
# 시크릿(코드/파일에 값 적지 말 것) - `wrangler secret put <NAME>` 으로 이 프로젝트에
# 새 값을 등록하세요. 기존 워커에 등록된 값을 재사용하면 relay/키움 세션이 다시 공유됩니다.
#
#   KIWOOM_APP_KEY / KIWOOM_APP_SECRET            (모의투자 앱키)
#   KIWOOM_APP_KEY_REAL / KIWOOM_APP_SECRET_REAL  (실전투자 앱키 - relay와 동일 값 사용)
#   KIWOOM_MOCK                                   ("1"이면 모의투자, 그 외 실전)
#   KIWOOM_BUY_QTY / KIWOOM_SELL_QTY
#   NAVER_CLIENT_ID / NAVER_CLIENT_SECRET
#   DART_API_KEY
#   ADMIN_KEY                                     (relay -> Worker 관리용 API 호출 인증)
#   KAKAO_CLIENT_ID / KAKAO_REFRESH_TOKEN
#   RELAY_URL                                     (이 워커 전용 relay 인스턴스 주소)
#   RELAY_SECRET                                  (이 워커 전용 relay 인스턴스 시크릿)
# ---------------------------------------------------------------------------
